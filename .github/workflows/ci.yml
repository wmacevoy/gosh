# CI runs the command the guide names, and nothing else, so that there is one
# recipe and it cannot drift (SE1/O3). What is checked is in the script the step runs.
# (The doctor looks for the command's name anywhere in this file, so it is written
# once, in the step: a comment naming it would pass a workflow that did not run it.)
name: check
on:
  push:
  pull_request:
jobs:
  check:
    # Named, not "latest": its mosh package is the stock mosh 1.4.0 the check meets.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the doctor reads recent commits
          submodules: true # core/, upstream at the pinned commit
      - name: What the core needs to build, and a stock mosh to meet
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q autoconf automake pkg-config protobuf-compiler libprotobuf-dev libncurses-dev libssl-dev zlib1g-dev mosh
          mosh-server --version | head -1
      - run: tools/check.sh
