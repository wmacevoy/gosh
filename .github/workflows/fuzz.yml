#
# Every part's fuzzer under libFuzzer and AddressSanitizer, 60 seconds each, on every push (queue
# item 21). The recipe is tools/fuzz.sh, so that it is the same here and on any machine with clang.
# A crash fails the run, and the input that caused it is kept as an artifact: add it to the
# fuzzer's corpus with the fix, so that the check replays it from then on.
name: fuzz
on:
  push:
  pull_request:
jobs:
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # core/, upstream at the pinned commit
      - name: What the core needs to build, and clang
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q autoconf automake pkg-config protobuf-compiler libprotobuf-dev libncurses-dev libssl-dev zlib1g-dev clang
          clang++ --version | head -1
      - name: Each fuzzer for 60 seconds
        run: tools/fuzz.sh 60
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crashes
          path: |
            .build/fuzz-*-crash-*
            .build/fuzz-run.log
            .build/fuzz-build.log
            .build/build.log
          if-no-files-found: ignore
          include-hidden-files: true # (.build is hidden, and upload-artifact leaves hidden files out by default)
